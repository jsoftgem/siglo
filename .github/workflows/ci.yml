name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Lint codebase
        run: npm run lint

      - name: Run Core unit tests & 100% coverage check
        run: npm test

      - name: Run Ecosystem package test suites
        run: npm run test:packages

      - name: Check notification coverage without provider network requests
        run: npm run test:coverage --workspace=@siglo/notifications

      - name: Run Production examples test suites
        run: npm run test:examples

      - name: Run Automated Exploratory & Chaos test suite
        run: npm run test:exploratory

  notification-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: siglo
          POSTGRES_PASSWORD: siglo_test
          POSTGRES_DB: siglo_notifications_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siglo -d siglo_notifications_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:postgres --workspace=@siglo/notifications
        env:
          SIGLO_TEST_POSTGRES_URL: postgres://siglo:siglo_test@localhost:5432/siglo_notifications_test
