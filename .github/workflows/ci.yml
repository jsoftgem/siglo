name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build all packages
        run: npm run build

      - name: Lint codebase
        run: npm run lint

      - name: Run Core unit tests & 100% coverage check
        run: npm test

      - name: Run Ecosystem package test suites
        run: npm run test:packages

      - name: Run IDE test suites
        run: npm run test:ide

      - name: Check notification coverage without provider network requests
        run: npm run test:coverage --workspace=@siglo/notifications

      - name: Check AI coverage and inferred types without provider network requests
        run: npm run test:coverage --workspace=@siglo/ai

      - name: Run Production examples test suites
        run: npm run test:examples

      - name: Run Monitoring integration tests
        run: npm run test:monitoring

      - name: Audit dependencies
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org/

      - name: Run Automated Exploratory & Chaos test suite
        run: npm run test:exploratory

  notification-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: siglo
          POSTGRES_PASSWORD: siglo_test
          POSTGRES_DB: siglo_notifications_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siglo -d siglo_notifications_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:postgres --workspace=@siglo/notifications
        env:
          SIGLO_TEST_POSTGRES_URL: postgres://siglo:siglo_test@localhost:5432/siglo_notifications_test

  intellij-plugin:
    name: IntelliJ Plugin Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies & build IDE packages
        run: |
          npm ci
          npm run build --workspace=@siglo/ide-protocol
          npm run build --workspace=@siglo/ide-analysis
          npm run build --workspace=@siglo/ide-ui
          cp packages/ide-ui/dist/index.html plugins/intellij/src/main/resources/ide-ui/index.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, Build & Verify Plugin
        working-directory: plugins/intellij
        run: ./gradlew test buildPlugin verifyPlugin

  kafka-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@siglo/core
      - name: Start isolated Kafka and outbox database
        run: docker compose -p siglo-kafka-recovery-tests -f packages/kafka/integration/compose.yaml up -d --wait --wait-timeout 120
      - name: Run Kafka recovery and transactional outbox tests
        run: npm run test:integration --workspace=@siglo/kafka
      - name: Show service logs on failure
        if: failure()
        run: docker compose -p siglo-kafka-recovery-tests -f packages/kafka/integration/compose.yaml logs --no-color --tail 200
      - name: Remove test services
        if: always()
        run: docker compose -p siglo-kafka-recovery-tests -f packages/kafka/integration/compose.yaml down -v
