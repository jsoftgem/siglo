services:
  # ===========================================================================
  # 1. Jaeger All-In-One: Distributed Tracing Backend & Web UI
  #    Receives OTLP traces directly on 4317 (gRPC) and 4318 (HTTP)
  #    Web UI accessible at http://localhost:16686
  # ===========================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: siglo-jaeger
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - METRICS_STORAGE_TYPE=prometheus
    restart: unless-stopped

  # ===========================================================================
  # 2. Prometheus: Metrics Aggregation
  #    Scrapes Jaeger / Collector metrics
  #    Web UI accessible at http://localhost:9090
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: siglo-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  # ===========================================================================
  # 3. Grafana: Unified Observability Dashboard
  #    Auto-provisioned with Jaeger tracing & Prometheus metrics datasources
  #    Web UI accessible at http://localhost:3000 (admin / admin)
  # ===========================================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: siglo-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - jaeger
      - prometheus
    restart: unless-stopped
