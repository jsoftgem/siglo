services:
    kafka:
        image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:8.1.1}
        ports:
            - '127.0.0.1:19092:19092'
        environment:
            CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        healthcheck:
            test: ['CMD', 'kafka-topics', '--bootstrap-server', 'localhost:19092', '--list']
            interval: 5s
            timeout: 5s
            retries: 20
    postgres:
        image: postgres:17-alpine
        ports:
            - '127.0.0.1:15434:5432'
        environment:
            POSTGRES_USER: siglo
            POSTGRES_PASSWORD: siglo
            POSTGRES_DB: siglo_kafka_test
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U siglo -d siglo_kafka_test']
            interval: 2s
            timeout: 3s
            retries: 15
