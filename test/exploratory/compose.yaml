services:
    postgres:
        image: postgres:17-alpine
        ports:
            - '127.0.0.1:15439:5432'
        environment:
            POSTGRES_USER: siglo
            POSTGRES_PASSWORD: siglo_test
            POSTGRES_DB: siglo_exploratory_test
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U siglo -d siglo_exploratory_test']
            interval: 2s
            timeout: 3s
            retries: 20
    redis:
        image: redis:7-alpine
        ports:
            - '127.0.0.1:16389:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 2s
            timeout: 3s
            retries: 20
